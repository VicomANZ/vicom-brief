body::before{content:'';position:fixed;inset:0;background:rgba(29,35,39,.35);z-index:0}
.ctr{max-width:1100px;margin:0 auto;padding:20px;position:relative;z-index:1}

/* HEADER */
.header{background:rgba(29,35,39,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:var(--frost-border);color:#fff;padding:24px 28px;border-radius:14px;margin-bottom:16px}
.header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hb{display:flex;align-items:center;gap:14px}
.hb h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.hb .div{width:1px;height:28px;background:rgba(255,255,255,.15)}
.hb .lbl{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px}
.dn{display:flex;align-items:center;gap:8px}
.dn button{background:rgba(255,255,255,.08);border:var(--frost-border);color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(8px)}
.dn button:hover:not(:disabled){background:rgba(255,255,255,.15)}
.dn button:disabled{opacity:.25;cursor:default}
.dn .dd{font-size:14px;font-weight:600;min-width:180px;text-align:center}
.as{display:flex;align-items:center;gap:8px;padding:10px 0 0;flex-wrap:wrap}
.agent-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;backdrop-filter:blur(8px)}
.agent-pill.ok{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.agent-pill.warn{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.agent-pill.bad{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.dot{width:6px;height:6px;border-radius:50%}.agent-pill.ok .dot{background:#4ade80}.agent-pill.warn .dot{background:#fbbf24}.agent-pill.bad .dot{background:#f87171}

/* VIEW TABS */
.vtw{display:flex;gap:4px;margin-bottom:16px;background:var(--glass);backdrop-filter:blur(var(--frost-blur));-webkit-backdrop-filter:blur(var(--frost-blur));border:var(--frost-border);border-radius:10px;padding:4px;width:fit-content;flex-wrap:wrap}
.vt{padding:8px 18px;border:none;border-radius:8px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;background:transparent;color:var(--dim);transition:all .2s;white-space:nowrap}
.vt:hover{color:#fff;background:rgba(255,255,255,.06)}
.vt.active{background:var(--dark-blue);color:#fff;box-shadow:0 2px 8px rgba(41,87,144,.4)}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--glass);backdrop-filter:blur(var(--frost-blur));-webkit-backdrop-filter:blur(var(--frost-blur));border:var(--frost-border);border-radius:10px;padding:16px 18px}
.stat-label{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.stat-val{font-size:28px;font-weight:800;color:#fff}.stat-sub{font-size:14px;font-weight:400;color:var(--dim)}

/* SECTION TABS */
.sec-tabs{display:flex;gap:2px;margin-bottom:16px;overflow-x:auto;border-bottom:1px solid var(--border)}
.sec-tab{padding:8px 14px;border:none;background:transparent;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap}
.sec-tab:hover{color:#fff}.sec-tab.active{color:var(--light-blue);border-bottom-color:var(--light-blue)}

/* GLASS CARD */
.glass-card{background:var(--glass);backdrop-filter:blur(var(--frost-blur));-webkit-backdrop-filter:blur(var(--frost-blur));border:var(--frost-border);border-radius:10px;padding:18px;margin-bottom:10px;transition:all .2s}
.glass-card:hover{background:var(--glass-hover)}
.glass-card-dark{background:rgba(29,35,39,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:var(--frost-border);border-radius:10px;padding:18px;margin-bottom:10px}
.card-title{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;color:var(--light-blue)}

/* SECTION HEADERS */
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.section-title{font-size:15px;font-weight:700;color:#fff}
.section-accent{width:3px;height:18px;border-radius:2px}
.tab-content{display:none}.tab-content.active{display:block}

/* CRITICAL ITEMS */
.crit-item{display:flex;align-items:flex-start;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:6px;gap:10px;backdrop-filter:blur(8px)}
.crit-item.crit{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2)}
.crit-item.high{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.15)}
.crit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.crit-dot.c{background:var(--red)}.crit-dot.h{background:var(--amber)}
.crit-text{flex:1;line-height:1.4;color:rgba(255,255,255,.9)}

/* KPI */
.kpi-row{margin-bottom:12px}.kpi-header{display:flex;justify-content:space-between;margin-bottom:4px}
.kpi-label{font-size:13px;color:rgba(255,255,255,.8)}.kpi-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.progress-wrap{display:flex;align-items:center;gap:10px;width:100%}
.progress-track{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .8s}
.progress-val{font-size:13px;font-weight:700;min-width:40px;text-align:right}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.b-red{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.b-green{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.b-amber{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.b-blue{background:rgba(45,146,255,.15);color:#7dd3fc;border:1px solid rgba(45,146,255,.2)}
.b-navy{background:var(--dark-blue);color:#fff}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* LIST */
.list-item{padding:8px 0;border-bottom:1px solid var(--border)}.list-item:last-child{border-bottom:none}
.list-name{font-size:13px;font-weight:600;color:#fff}.list-sub{font-size:12px;color:var(--dim)}

/* MEETING ENTRY */
.meeting-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0}

/* EVENT */
.event-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.event-name{font-size:16px;font-weight:700;color:#fff}
.event-meta{font-size:12px;color:var(--dim)}
.event-flag{font-size:12px;color:#fbbf24;padding:3px 0;display:flex;align-items:flex-start;gap:6px}

/* FINANCE */
.fin-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.fin-row:last-child{border-bottom:none}
.fin-name{font-size:13px;color:rgba(255,255,255,.85)}.fin-val{font-size:14px;font-weight:700}

/* ACTIONS */
.action-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;border-bottom:1px solid var(--border);user-select:none}.action-item:last-child{border-bottom:none}
.action-check{width:20px;height:20px;border-radius:5px;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s}
.action-check.ck{border-color:var(--green);background:rgba(34,197,94,.15)}
.tick{color:var(--green);font-size:12px;font-weight:700;display:none}.action-check.ck .tick{display:block}
.action-label{font-size:13px;line-height:1.4;color:rgba(255,255,255,.85)}.action-label.ck{color:rgba(255,255,255,.3);text-decoration:line-through}

/* BIG NUMBER */
.bn{text-align:center}.bn .bv{font-size:28px;font-weight:800;color:#fff}

/* WST (weekly section title) */
.wst{font-size:12px;font-weight:700;color:var(--light-blue);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}

/* WM (weekly metric) */
.wm{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.wm:last-child{border-bottom:none}
.wm .mn{font-size:13px;font-weight:500;color:rgba(255,255,255,.8)}.wm .mv{font-size:14px;font-weight:700;color:#fff}

/* LOADING / NO DATA */
.loading{text-align:center;padding:60px 20px;color:var(--dim)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--light-blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.no-data{text-align:center;padding:40px 20px;background:var(--glass);backdrop-filter:blur(var(--frost-blur));border:var(--frost-border);border-radius:10px;color:var(--dim)}

/* ANIMATE */
.animate-in{animation:fadeSlideIn .4s ease-out both}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:640px){.stats-row{grid-template-columns:repeat(2,1fr)}.g2,.g3,.g4{grid-template-columns:1fr}.header-row{flex-direction:column;align-items:flex-start}}
@media print{.sec-tabs,.vtw,.dn{display:none}.tab-content{display:block!important;page-break-inside:avoid;margin-bottom:20px}}
</style>
</head>
<body>
<div class="ctr">
  <div class="header">
    <div class="header-row">
      <div class="hb"><h1>Vicom</h1><div class="div"></div><span class="lbl">Marketing Brief</span></div>
      <div class="dn">
        <button id="prevBtn" onclick="nav(-1)">&#8249;</button>
        <span class="dd" id="dateDisplay">Loading...</span>
        <button id="nextBtn" onclick="nav(1)">&#8250;</button>
      </div>
    </div>
    <div class="as" id="agentStatus"></div>
  </div>
  <div class="vtw">
    <button class="vt active" data-view="daily" onclick="switchView('daily',this)">Daily</button>
    <button class="vt" data-view="weekly" onclick="switchView('weekly',this)">Weekly</button>
    <button class="vt" data-view="monthly" onclick="switchView('monthly',this)">Monthly</button>
    <button class="vt" data-view="quarterly" onclick="switchView('quarterly',this)">Quarterly</button>
    <button class="vt" data-view="annual" onclick="switchView('annual',this)">Annual</button>
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div>Loading brief data...</div></div>
</div>
<script>
const DATA_URL='./';
const INDEX_URL='./index.json';
let allDates=[],allData={},currentIdx=0,currentView='daily',checkedActions={};
const $=id=>document.getElementById(id);
const fmtDate=ds=>{const d=new Date(ds+'T12:00:00');const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${days[d.getDay()]} ${d.getDate()} ${mos[d.getMonth()]} ${d.getFullYear()}`};
const getWeek=ds=>{const d=new Date(ds+'T12:00:00');const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));const fri=new Date(mon);fri.setDate(mon.getDate()+4);return{start:mon.toISOString().split('T')[0],end:fri.toISOString().split('T')[0],label:`${fmtDate(mon.toISOString().split('T')[0]).slice(4)} — ${fmtDate(fri.toISOString().split('T')[0]).slice(4)}`}};
const getMonth=ds=>ds.slice(0,7);
const getQuarter=ds=>{const m=parseInt(ds.slice(5,7));return ds.slice(0,4)+'-Q'+Math.ceil(m/3)};
const getYear=ds=>ds.slice(0,4);
const monthLabel=ds=>{const mos=['January','February','March','April','May','June','July','August','September','October','November','December'];return mos[parseInt(ds.slice(5,7))-1]+' '+ds.slice(0,4)};
const qLabel=q=>{const[y,qn]=q.split('-');return qn.toUpperCase()+' '+y};

function navPage(page, el) {
  document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('[id^="page-"]').forEach(p=>p.style.display='none');
  document.getElementById('page-'+page).style.display='block';
  document.querySelector('.sidebar').classList.remove('open');
  if(page==='overview') renderOverviewPage();
  if(page==='finance') renderFinancePage();
  if(page==='meetings') renderMeetingsPage();
  if(page==='promotions') renderPromotionsPage();
  if(page==='events') renderEventsPage();
}

// ===== OVERVIEW PAGE =====
function renderOverviewPage(){
  const d = getLatestData();
  if(!d){ $('overview-content').innerHTML='<div class="no-data">No data available yet. Waiting for first daily brief.</div>';return; }
  let h='';

  // Date banner
  h+=`<div class="glass-card-dark animate-in" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:16px;font-weight:700">${d.date_label||fmtDate(d.date)}</div><div style="font-size:13px;opacity:0.6">${d.week_label||''}</div></div><div style="display:flex;gap:6px">`;
  (d.agents?.reporting||[]).length && (h+=`<span class="badge" style="background:rgba(42,157,92,0.2);color:#6fdb9e;border:none">${(d.agents?.reporting||[]).length} sources</span>`);
  (d.agents?.missing||[]).length && (h+=`<span class="badge" style="background:rgba(214,58,58,0.2);color:#f08080;border:none">${(d.agents?.missing||[]).length} missing</span>`);
  h+=`</div></div></div>`;

  // Top-level stats
  const crit = d.critical?.filter(c=>c.severity==='critical').length||0;
  const high = d.critical?.filter(c=>c.severity==='high').length||0;
  const allK = [...(d.kpis?.content||[]),...(d.kpis?.website||[])];
  const onTrack = allK.filter(k=>k.current>=k.target).length;
  const totalAct = (d.actions||[]).reduce((s,c)=>s+c.items.length,0);
  const nextEvent = (d.events||[]).sort((a,b)=>a.days_out-b.days_out)[0];

  h+=`<div class="stats-row animate-in" style="animation-delay:0.05s">
    <div class="stat-card"><div class="stat-label">Critical</div><div class="stat-val" style="color:var(--red)">${crit}</div><div class="stat-sub">${high} high priority</div></div>
    <div class="stat-card"><div class="stat-label">KPIs on track</div><div class="stat-val" style="color:${onTrack>=allK.length*0.5?'var(--green)':'var(--red)'}">${onTrack}<span class="stat-sub">/${allK.length}</span></div></div>
    <div class="stat-card"><div class="stat-label">Next event</div><div class="stat-val" style="color:var(--accent)">${nextEvent?nextEvent.days_out:'-'}</div><div class="stat-sub">${nextEvent?'days':'no events'}</div></div>
    <div class="stat-card"><div class="stat-label">Actions today</div><div class="stat-val" style="color:var(--navy)">${totalAct}</div></div>
  </div>`;

  h+=`<div class="g2 animate-in" style="animation-delay:0.1s">`;

  // LEFT COLUMN
  h+=`<div>`;

  // Critical snapshot (top 3)
  const topCritical = (d.critical||[]).slice(0,4);
  if(topCritical.length){
    h+=`<div class="glass-card"><div class="card-title" style="color:var(--red)">Critical & urgent</div>`;
    topCritical.forEach(c=>{
      const sev=c.severity==='critical'?'critical':'high';
      const dot=c.severity==='critical'?'c':'h';
      h+=`<div class="crit-item ${sev}" style="margin-bottom:4px"><span class="crit-dot ${dot}"></span><span class="crit-text" style="font-size:12px">${c.text}</span></div>`;
    });
    if((d.critical||[]).length>4) h+=`<div style="text-align:center;padding-top:8px"><a style="font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600" onclick="document.querySelector('[data-page=brief]').click()">View all ${d.critical.length} items →</a></div>`;
    h+=`</div>`;
  }

  // KPI snapshot
  h+=`<div class="glass-card"><div class="card-title" style="color:var(--accent)">KPI snapshot</div>`;
  h+=`<div class="g2" style="gap:8px">`;
  h+=`<div><div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Content</div>`;
  (d.kpis?.content||[]).forEach(k=>{
    const ok=k.current>=k.target;
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px"><span style="color:var(--text-secondary)">${k.label}</span><span style="font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${k.current}/${k.target}</span></div>`;
  });
  h+=`</div><div><div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Website & SEO</div>`;
  (d.kpis?.website||[]).forEach(k=>{
    const ok=k.current>=k.target;
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px"><span style="color:var(--text-secondary)">${k.label}</span><span style="font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${k.current}/${k.target}</span></div>`;
  });
  h+=`</div></div></div>`;

  // Meetings snapshot
  h+=`<div class="glass-card"><div class="card-title" style="color:var(--blue)">Today's calendar</div>`;
  if(d.meetings?.today?.length){
    d.meetings.today.forEach(m=>{
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)"><div><div style="font-size:13px;font-weight:600;color:var(--navy)">${m.name}</div><div class="list-sub">${m.time||''} · ${m.type||''}</div></div>${m.warning?`<span class="badge b-red">${m.warning}</span>`:''}</div>`;
    });
  } else { h+=`<div style="font-size:13px;color:var(--text-tertiary)">No meetings today.</div>`; }
  if(d.meetings?.follow_up?.length){
    h+=`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)"><div style="font-size:11px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Needs follow-up</div>`;
    d.meetings.follow_up.slice(0,3).forEach(m=>{
      h+=`<div style="font-size:12px;color:var(--amber);padding:3px 0">${m.name} — ${m.issue}</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;

  h+=`</div>`; // end left

  // RIGHT COLUMN
  h+=`<div>`;

  // Events snapshot
  h+=`<div class="glass-card"><div class="card-title" style="color:var(--navy)">Upcoming events</div>`;
  (d.events||[]).slice(0,3).forEach(evt=>{
    const pct=evt.tasks_total>0?Math.round((evt.tasks_complete/evt.tasks_total)*100):0;
    const urgCol=evt.days_out<=21?'var(--red)':evt.days_out<=60?'var(--amber)':'var(--blue)';
    h+=`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:13px;font-weight:600;color:var(--navy)">${evt.name}</span><span class="badge" style="background:${urgCol};color:#fff;border:none">${evt.days_out}d</span></div>`;
    h+=`<div class="list-sub" style="margin-bottom:4px">${evt.date} · ${evt.location}</div>`;
    h+=`<div class="progress-wrap"><div class="progress-track" style="height:5px"><div class="progress-fill" style="width:${pct}%;background:${urgCol};height:5px"></div></div><span style="font-size:11px;font-weight:700;color:${urgCol};min-width:35px;text-align:right">${pct}%</span></div>`;
    h+=`</div>`;
  });
  if((d.events||[]).length>3) h+=`<div style="text-align:center;padding-top:8px"><a style="font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600" onclick="document.querySelector('[data-page=events]').click()">View all ${d.events.length} events →</a></div>`;
  h+=`</div>`;

  // Promotions snapshot
  const promos = d.content?.promotions;
  h+=`<div class="glass-card"><div class="card-title" style="color:var(--accent)">Promotions</div>`;
  if(promos?.count){
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:24px;font-weight:700;color:var(--navy)">${promos.count}</span>`;
    if(promos.ending_soon) h+=`<span class="badge b-red">${promos.ending_soon} ending soon</span>`;
    h+=`</div>`;
    if(promos.end_note) h+=`<div style="font-size:12px;color:var(--amber);padding:8px 10px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius-sm)">${promos.end_note}</div>`;
  } else { h+=`<div style="font-size:13px;color:var(--text-tertiary)">No active promotions.</div>`; }
  h+=`</div>`;

  // Finance snapshot
  h+=`<div class="glass-card"><div class="card-title" style="color:var(--amber)">Finance</div>`;
  // Try from finance.json first, fallback to brief data
  if(SUBS.length){
    const totalM=SUBS.reduce((s,x)=>s+x.monthly,0);
    const thomasM=SUBS.filter(s=>s.payment==='Thomas Flood').reduce((s,x)=>s+x.monthly,0);
    h+=`<div class="g2" style="gap:8px;margin-bottom:8px"><div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--navy)">$${Math.round(totalM)}</div><div style="font-size:11px;color:var(--text-tertiary)">/month total</div></div><div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--amber)">$${Math.round(thomasM)}</div><div style="font-size:11px;color:var(--text-tertiary)">/month Thomas</div></div></div>`;
    h+=`<div style="font-size:12px;color:var(--text-secondary);text-align:center">${SUBS.length} active subscriptions</div>`;
    // Nearest renewal
    const now=new Date();
    const nextRenewal=SUBS.filter(s=>{const r=new Date(s.renewal);return(r-now)/(1000*60*60*24)>0}).sort((a,b)=>new Date(a.renewal)-new Date(b.renewal))[0];
    if(nextRenewal){
      const diff=Math.ceil((new Date(nextRenewal.renewal)-now)/(1000*60*60*24));
      h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Next renewal: ${nextRenewal.name}</span><span class="badge ${diff<=7?'b-red':diff<=30?'b-amber':'b-blue'}">${diff}d</span></div>`;
    }
  } else if(d.finance?.totals){
    h+=`<div class="g2" style="gap:8px"><div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--navy)">$${d.finance.totals.monthly||0}</div><div style="font-size:11px;color:var(--text-tertiary)">/month</div></div><div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--amber)">$${d.finance.totals.thomas_monthly||0}</div><div style="font-size:11px;color:var(--text-tertiary)">Thomas</div></div></div>`;
  }
  h+=`</div>`;

  // Website & SEO snapshot
  if(d.website?.backlogs){
    h+=`<div class="glass-card"><div class="card-title" style="color:var(--blue)">Website & SEO backlog</div>`;
    h+=`<div class="g3" style="gap:8px;text-align:center">`;
    h+=`<div><div style="font-size:22px;font-weight:700;color:var(--navy)">${d.website.backlogs.website_pages}</div><div style="font-size:11px;color:var(--text-tertiary)">Website</div></div>`;
    h+=`<div><div style="font-size:22px;font-weight:700;color:var(--navy)">${d.website.backlogs.product_pages}</div><div style="font-size:11px;color:var(--text-tertiary)">Product</div></div>`;
    h+=`<div><div style="font-size:22px;font-weight:700;color:var(--accent)">${d.website.backlogs.seo}</div><div style="font-size:11px;color:var(--text-tertiary)">SEO</div></div>`;
    h+=`</div></div>`;
  }

  h+=`</div>`; // end right
  h+=`</div>`; // end g2

  // Top actions (first 5)
  const topActions = [];
  (d.actions||[]).forEach(cat=>{cat.items.forEach(item=>{if(topActions.length<5)topActions.push({cat:cat.category,item})})});
  if(topActions.length){
    h+=`<div class="glass-card animate-in" style="animation-delay:0.2s;border-left:3px solid var(--green)"><div class="card-title" style="color:var(--green)">Top priority actions</div>`;
    topActions.forEach((a,i)=>{
      h+=`<div style="display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;font-weight:700;color:var(--accent);min-width:18px">${i+1}.</span><div><div style="font-size:13px;color:var(--navy)">${a.item}</div><div class="list-sub">${a.cat}</div></div></div>`;
    });
    h+=`<div style="text-align:center;padding-top:10px"><a style="font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600" onclick="document.querySelector('[data-page=brief]').click()">View all ${totalAct} actions →</a></div>`;
    h+=`</div>`;
  }

  $('overview-content').innerHTML=h;
}

// ===== MEETINGS PAGE =====
function renderMeetingsPage(){
  const d = getLatestData();
  if(!d){ $('meetings-content').innerHTML='<div class="no-data">No data available. Waiting for daily brief.</div>';return; }
  let h='';

  // Today
  h+='<div class="section-head animate-in"><div class="section-accent" style="background:var(--accent)"></div><div class="section-title">Today</div></div>';
  if(d.meetings?.today?.length){
    d.meetings.today.forEach(m=>{
      h+=`<div class="glass-card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="list-name" style="font-size:15px">${m.name}</div><div class="list-sub">${m.time||''} · ${m.type||''}${m.participants?' · '+m.participants:''}</div></div>${m.warning?`<span class="badge b-red">${m.warning}</span>`:''}</div></div>`;
    });
  } else { h+='<div class="glass-card" style="color:var(--text-tertiary);font-size:13px">No meetings today.</div>'; }

  // Tomorrow
  h+='<div class="section-head animate-in" style="animation-delay:0.1s;margin-top:20px"><div class="section-accent" style="background:var(--blue)"></div><div class="section-title">Tomorrow</div></div>';
  if(d.meetings?.tomorrow?.length){
    d.meetings.tomorrow.forEach(m=>{
      h+=`<div class="glass-card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="list-name" style="font-size:15px">${m.name}</div><div class="list-sub">${m.time||''} · ${m.type||''}${m.participants?' · '+m.participants:''}</div></div>${m.warning?`<span class="badge b-red">${m.warning}</span>`:''}</div></div>`;
    });
  } else { h+='<div class="glass-card" style="color:var(--text-tertiary);font-size:13px">No meetings tomorrow.</div>'; }

  // Upcoming
  if(d.meetings?.upcoming?.length){
    h+='<div class="section-head animate-in" style="animation-delay:0.2s;margin-top:20px"><div class="section-accent" style="background:var(--navy)"></div><div class="section-title">Upcoming</div></div>';
    h+='<div class="glass-card">';
    d.meetings.upcoming.forEach(m=>{
      h+=`<div class="list-item"><div><div class="list-name">${m.name}</div><div class="list-sub">${m.date||''} · ${m.time||''} · ${m.type||''}</div></div>${m.warning?`<span class="badge b-red">${m.warning}</span>`:''}</div>`;
    });
    h+='</div>';
  }

  // Follow-ups
  if(d.meetings?.follow_up?.length){
    h+='<div class="section-head animate-in" style="animation-delay:0.3s;margin-top:20px"><div class="section-accent" style="background:var(--amber)"></div><div class="section-title">Needs follow-up</div></div>';
    h+='<div class="glass-card">';
    d.meetings.follow_up.forEach(m=>{
      h+=`<div class="list-item"><div><div class="list-name">${m.name}</div><div class="list-sub" style="color:var(--amber)">${m.issue}</div></div></div>`;
    });
    h+='</div>';
  }

  // Weekly summary
  if(d.weekly_summary){
    h+='<div class="section-head animate-in" style="animation-delay:0.4s;margin-top:20px"><div class="section-accent" style="background:var(--green)"></div><div class="section-title">This week</div></div>';
    h+=`<div class="stats-row"><div class="stat-card"><div class="stat-label">Scheduled</div><div class="stat-val" style="color:var(--navy)">${d.weekly_summary.meetings_scheduled||0}</div></div><div class="stat-card"><div class="stat-label">Completed</div><div class="stat-val" style="color:var(--green)">${d.weekly_summary.meetings_completed||0}</div></div><div class="stat-card"><div class="stat-label">Cancelled</div><div class="stat-val" style="color:var(--text-tertiary)">${d.weekly_summary.meetings_cancelled||0}</div></div><div class="stat-card"><div class="stat-label">Outstanding follow-ups</div><div class="stat-val" style="color:${(d.weekly_summary.outstanding_followups||0)>0?'var(--red)':'var(--green)'}">${d.weekly_summary.outstanding_followups||0}</div></div></div>`;
  }

  $('meetings-content').innerHTML=h;
}

// ===== PROMOTIONS PAGE =====
function renderPromotionsPage(){
  const d = getLatestData();
  if(!d){ $('promotions-content').innerHTML='<div class="no-data">No data available. Waiting for daily brief.</div>';return; }
  const promos = d.content?.promotions;
  let h='';

  // Stats
  h+=`<div class="stats-row animate-in">
    <div class="stat-card"><div class="stat-label">Active promotions</div><div class="stat-val" style="color:var(--accent)">${promos?.count||0}</div></div>
    <div class="stat-card"><div class="stat-label">Ending soon</div><div class="stat-val" style="color:var(--red)">${promos?.ending_soon||0}</div></div>
  </div>`;

  // End note warning
  if(promos?.end_note){
    h+=`<div class="glass-card animate-in" style="animation-delay:0.1s;border-left:3px solid var(--red)"><div style="display:flex;gap:10px;align-items:flex-start"><span style="font-size:18px">&#9888;</span><div><div style="font-weight:700;color:var(--navy);margin-bottom:4px">Attention required</div><div style="font-size:13px;color:var(--text-secondary)">${promos.end_note}</div></div></div></div>`;
  }

  // All promotions
  if(promos?.items?.length){
    h+='<div class="section-head animate-in" style="animation-delay:0.2s;margin-top:16px"><div class="section-accent" style="background:var(--accent)"></div><div class="section-title">Active promotions</div></div>';
    h+='<div class="glass-card">';
    promos.items.forEach((p,i)=>{
      h+=`<div class="list-item"><div><div class="list-name">${p}</div></div><span class="badge b-blue">Active</span></div>`;
    });
    h+='</div>';
  } else {
    h+='<div class="glass-card" style="color:var(--text-tertiary);font-size:13px;text-align:center;padding:40px">No active promotions.</div>';
  }

  // Content due (related to promos)
  if(d.content?.due_today?.length){

// ===== EVENTS PAGE =====
function renderEventsPage(){
  const d = getLatestData();
  if(!d){ $('events-content').innerHTML='<div class="no-data">No data available. Waiting for daily brief.</div>';return; }
  let h='';
  const evts = d.events||[];

  // Stats
  const urgent = evts.filter(e=>e.days_out<=30).length;
  const totalTasks = evts.reduce((s,e)=>s+e.tasks_total,0);
  const completeTasks = evts.reduce((s,e)=>s+e.tasks_complete,0);
  const overallPct = totalTasks>0?Math.round((completeTasks/totalTasks)*100):0;

  h+=`<div class="stats-row animate-in">
    <div class="stat-card"><div class="stat-label">Total events</div><div class="stat-val" style="color:var(--navy)">${evts.length}</div></div>
    <div class="stat-card"><div class="stat-label">Within 30 days</div><div class="stat-val" style="color:var(--red)">${urgent}</div></div>
    <div class="stat-card"><div class="stat-label">Tasks complete</div><div class="stat-val" style="color:var(--green)">${completeTasks}<span class="stat-sub">/${totalTasks}</span></div></div>
    <div class="stat-card"><div class="stat-label">Overall progress</div><div class="stat-val" style="color:var(--accent)">${overallPct}%</div></div>
  </div>`;

  // Each event as a detailed card
  evts.forEach((evt,i)=>{
    const pct=evt.tasks_total>0?Math.round((evt.tasks_complete/evt.tasks_total)*100):0;
    const urgencyBadge = evt.days_out<=21?'b-red':evt.days_out<=60?'b-amber':'b-blue';
    const borderCol = evt.days_out<=21?'var(--red)':evt.days_out<=60?'var(--amber)':'var(--border)';

    h+=`<div class="glass-card animate-in" style="animation-delay:${0.1*(i+1)}s;border-left:3px solid ${borderCol}">`;
    h+=`<div class="event-header"><div><div class="event-name">${evt.name}</div><div class="event-meta">${evt.date} · ${evt.location}</div></div><span class="badge ${urgencyBadge}">${evt.days_out} days</span></div>`;

    // Progress bar
    h+=`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:12px;color:var(--text-tertiary)">Task completion</span><span style="font-size:12px;font-weight:700;color:var(--accent)">${evt.tasks_complete}/${evt.tasks_total} (${pct}%)</span></div><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${pct>=75?'var(--green)':pct>=25?'var(--accent)':'var(--red)'}"></div></div></div></div>`;

    // Flags
    if(evt.flags?.length){
      h+='<div style="border-top:1px solid var(--border);padding-top:10px">';
      evt.flags.forEach(f=>{
        const isOverdue = f.toLowerCase().includes('overdue');
        h+=`<div class="event-flag" style="color:${isOverdue?'var(--red)':'var(--amber)'}"><span>${isOverdue?'&#10060;':'&#9888;'}</span> ${f}</div>`;
      });
      h+='</div>';
    }
    h+='</div>';
  });

  if(!evts.length){
    h+='<div class="glass-card" style="color:var(--text-tertiary);font-size:13px;text-align:center;padding:40px">No events found in data.</div>';
  }

  $('events-content').innerHTML=h;
}

// ===== HARDCODED SUBSCRIPTION DATA (source of truth from ClickUp Cost Tracking) =====
let SUBS = [];

async function loadFinanceData(){
  if(financeLoaded) return;
  try {
    const r = await fetch('./finance.json');
    if(r.ok){
      const data = await r.json();
      SUBS = data.active || [];
      CANCELLED = data.cancelled || [];
      financeLoaded = true;
      // Update sidebar
      const totalMonthly = SUBS.reduce((s,x)=>s+x.monthly,0);
      const sc=$('sidebarCost'),ss=$('sidebarSubs');
      if(sc) sc.textContent = '$'+Math.round(totalMonthly)+'/mo';
      if(ss) ss.textContent = SUBS.length;
    }
  } catch(e){ console.error('Finance data load failed',e); }
}

async function init(){
  loadFinanceData();
  try{const r=await fetch(INDEX_URL);if(r.ok){const idx=await r.json();allDates=idx.dates||idx}}catch(e){}
  if(!allDates.length){const probe=[];const today=new Date();for(let i=90;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);probe.push(d.toISOString().split('T')[0])}const results=await Promise.allSettled(probe.map(async ds=>{const r=await fetch(`${DATA_URL}${ds}.json`);if(!r.ok)throw new Error();return{date:ds,data:await r.json()}}));results.forEach(r=>{if(r.status==='fulfilled'){allDates.push(r.value.date);allData[r.value.date]=r.value.data}})}
  if(!allDates.length){$('content').innerHTML='<div class="no-data">No brief data found yet.</div>';$('dateDisplay').textContent='No data';return}
  allDates.sort();currentIdx=allDates.length-1;await loadAndRender();renderOverviewPage();
}

async function loadDate(ds){if(allData[ds])return allData[ds];try{const r=await fetch(`${DATA_URL}${ds}.json`);if(!r.ok)return null;const data=await r.json();allData[ds]=data;return data}catch(e){return null}}

async function loadAndRender(){
  const ds=allDates[currentIdx];
  $('dateDisplay').textContent=fmtDate(ds);
  $('prevBtn').disabled=currentIdx<=0;
  $('nextBtn').disabled=currentIdx>=allDates.length-1;
  checkedActions={};
  const data=await loadDate(ds);
  if(!data){$('content').innerHTML=`<div class="no-data">No data for ${fmtDate(ds)}.</div>`;$('agentStatus').innerHTML='';return}
  renderAgents(data);
  renderView(data,ds);
  updateSidebar(data);
}

async function nav(dir){currentIdx=Math.max(0,Math.min(allDates.length-1,currentIdx+dir));await loadAndRender()}
function switchView(view,btn){currentView=view;document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const ds=allDates[currentIdx];const data=allData[ds];if(data)renderView(data,ds)}

function renderAgents(data){
  let h='';
  (data.agents?.reporting||[]).forEach(a=>{h+=`<span class="agent-pill ok"><span class="dot"></span>${a}</span>`});
  (data.agents?.partial||[]).forEach(a=>{h+=`<span class="agent-pill warn"><span class="dot"></span>${a}</span>`});
  (data.agents?.missing||[]).forEach(a=>{h+=`<span class="agent-pill bad"><span class="dot"></span>${a}</span>`});
  $('agentStatus').innerHTML=h;
}

function updateSidebar(d){
  const sc=$('sidebarCost'),ss=$('sidebarSubs');
  if(d.finance?.totals){if(sc)sc.textContent='$'+(d.finance.totals.monthly||353)+'/mo';if(ss)ss.textContent=d.finance.totals.active_subs||12}
}

function renderView(data,ds){
  switch(currentView){
    case'daily':renderDaily(data);break;
    case'weekly':renderWeeklySummary(ds);break;
    case'monthly':renderMonthlySummary(ds);break;
    case'quarterly':renderQuarterlySummary(ds);break;
    case'annual':renderAnnualSummary(ds);break;
  }
}

function renderDaily(d){
  const crit=d.critical?.filter(c=>c.severity==='critical').length||0;
  const allK=[...(d.kpis?.content||[]),...(d.kpis?.website||[])];
  const onTrack=allK.filter(k=>k.current>=k.target).length;
  const totalAct=(d.actions||[]).reduce((s,c)=>s+c.items.length,0);
  const decisions=(d.critical?.length||0);

  let h=`<div class="stats-row animate-in">
    <div class="stat-card"><div class="stat-label">Critical</div><div class="stat-val" style="color:var(--red)">${crit}</div></div>
    <div class="stat-card"><div class="stat-label">KPIs on track</div><div class="stat-val" style="color:var(--green)">${onTrack}<span class="stat-sub">/${allK.length}</span></div></div>
    <div class="stat-card"><div class="stat-label">Decisions</div><div class="stat-val" style="color:var(--blue)">${decisions}</div></div>
    <div class="stat-card"><div class="stat-label">Actions</div><div class="stat-val" style="color:var(--accent)">${totalAct}</div></div>
  </div>`;

  const secs=['overview','actions'];
  const labels=['Overview','Actions'];
  h+='<div class="sec-tabs">';
  secs.forEach((s,i)=>h+=`<button class="sec-tab ${i===0?'active':''}" onclick="showSec('${s}',this)">${labels[i]}</button>`);
  h+='</div>';

  // OVERVIEW
  h+='<div id="sec-overview" class="tab-content active animate-in">';
  h+='<div class="section-head"><div class="section-accent" style="background:var(--red)"></div><div class="section-title">Critical & urgent</div></div>';
  (d.critical||[]).forEach(c=>{
    const sev=c.severity==='critical'?'critical':'high';
    const dot=c.severity==='critical'?'c':'h';
    const badge=c.severity==='critical'?'b-red':'b-amber';
    h+=`<div class="crit-item ${sev}"><span class="crit-dot ${dot}"></span><span class="crit-text">${c.text}</span><span class="badge ${badge}">${c.source}</span></div>`;
  });
  h+='<div style="margin-top:20px" class="section-head"><div class="section-accent" style="background:var(--blue)"></div><div class="section-title">KPI dashboard</div></div><div class="g2">';
  h+='<div class="glass-card"><div class="card-title" style="color:var(--accent)">Content & campaigns</div>';
  (d.kpis?.content||[]).forEach(k=>h+=kpiRow(k));
  h+='</div><div class="glass-card"><div class="card-title" style="color:var(--accent)">Website & SEO</div>';
  (d.kpis?.website||[]).forEach(k=>h+=kpiRow(k));
  if(d.website?.seo_warning)h+=`<div style="margin-top:12px;padding:10px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius-sm);font-size:12px;color:var(--amber)">&#9888; ${d.website.seo_warning}</div>`;
  h+='</div></div></div>';

  // ACTIONS
  h+='<div id="sec-actions" class="tab-content">';
  h+='<div class="section-head"><div class="section-accent" style="background:var(--green)"></div><div class="section-title">Recommended actions</div></div>';
  h+=`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:12px;color:var(--text-tertiary)">Progress</span><span id="actr" style="font-size:12px;font-weight:700;color:var(--accent)">0/${totalAct}</span></div><div class="progress-wrap"><div class="progress-track"><div id="actprog" class="progress-fill" style="width:0%;background:var(--green);transition:width .3s"></div></div></div></div>`;
  h+='<div id="actbox"></div></div>';

  $('content').innerHTML=h;
  renderActions(d.actions||[]);
}

function kpiRow(k){
  const ok=k.current>=k.target;
  const pct=k.target>0?Math.min((k.current/k.target)*100,100):0;
  const col=ok?'var(--green)':'var(--red)';
  const lbl=ok?'&#10003; on track':'&#10007; behind';
  return`<div class="kpi-row"><div class="kpi-header"><span class="kpi-label">${k.label}</span><span class="kpi-status" style="color:${col}">${lbl}</span></div><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${col}"></div></div><span class="progress-val" style="color:${col}">${k.current}/${k.target}</span></div></div>`;
}

function meetingCard(title,items){
  let h=`<div class="glass-card"><div class="card-title" style="color:var(--blue)">${title}</div>`;
  if(!items?.length)h+='<span style="color:var(--text-tertiary);font-size:13px">None scheduled.</span>';
  else items.forEach(m=>h+=`<div class="meeting-entry"><div><div class="list-name">${m.name}</div><div class="list-sub">${m.time||''} · ${m.type||''}${m.participants?' · '+m.participants:''}</div></div>${m.warning?`<span class="badge b-red">${m.warning}</span>`:''}</div>`);
  return h+'</div>';
}

function showSec(id,btn){
  document.querySelectorAll('.sec-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('sec-'+id)?.classList.add('active');
}

function renderActions(groups){
  const box=$('actbox');if(!box)return;
  const total=groups.reduce((s,c)=>s+c.items.length,0);
  box.innerHTML='';
  groups.forEach((cat,ci)=>{
    const card=document.createElement('div');card.className='glass-card';
    let inner=`<div class="card-title" style="color:var(--accent)">${cat.category}</div>`;
    cat.items.forEach((item,ii)=>{
      const k=ci+'-'+ii;const ch=checkedActions[k]||false;
      inner+=`<div class="action-item" onclick="toggleAct('${k}')"><div class="action-check ${ch?'ck':''}"><span class="tick">&#10003;</span></div><span class="action-label ${ch?'ck':''}">${item}</span></div>`;
    });
    card.innerHTML=inner;box.appendChild(card);
  });
  updActProg(total);
}
function toggleAct(k){checkedActions[k]=!checkedActions[k];const d=allData[allDates[currentIdx]];if(d)renderActions(d.actions||[])}
function updActProg(total){
  const done=Object.values(checkedActions).filter(Boolean).length;
  const ctr=$('actr'),bar=$('actprog');
  if(ctr)ctr.textContent=done+'/'+total;
  if(bar)bar.style.width=((done/total)*100)+'%';
}

// ====== AGGREGATE VIEWS ======
const weeklyKpis={'LinkedIn Posts':3,'EDMs Sent':1,'Website Pages Built':1,'Product Pages Built':1,'SEO Pages Optimised':1,'LinkedIn Connections':1};
const monthlyKpis={'VIAVI EDM (month)':1,'Tektronix EDM (month)':1};

function scaleTarget(label,period){
  if(weeklyKpis[label]!==undefined){const wt=weeklyKpis[label];if(period==='weekly')return wt;if(period==='monthly')return wt*4;if(period==='quarterly')return wt*13;if(period==='annual')return wt*52}
  if(monthlyKpis[label]!==undefined){const mt=monthlyKpis[label];if(period==='weekly')return mt;if(period==='monthly')return mt;if(period==='quarterly')return mt*3;if(period==='annual')return mt*12}
  return null;
}

function getCumulativeKpis(datesInRange,period){
  const latest=allData[datesInRange[datesInRange.length-1]];
  if(!latest)return{content:[],website:[]};
  if(period==='weekly')return{content:(latest.kpis?.content||[]).map(k=>({label:k.label,current:k.current,target:scaleTarget(k.label,period)??k.target})),website:(latest.kpis?.website||[]).map(k=>({label:k.label,current:k.current,target:scaleTarget(k.label,period)??k.target}))};
  const weekBuckets={},monthBuckets={};
  datesInRange.forEach(d=>{const dd=allData[d];if(!dd)return;const wk=getWeek(d).start;const mo=getMonth(d);if(!weekBuckets[wk])weekBuckets[wk]={};if(!monthBuckets[mo])monthBuckets[mo]={};[...(dd.kpis?.content||[]),...(dd.kpis?.website||[])].forEach(k=>{if(weeklyKpis[k.label]!==undefined)weekBuckets[wk][k.label]=Math.max(weekBuckets[wk][k.label]||0,k.current);if(monthlyKpis[k.label]!==undefined)monthBuckets[mo][k.label]=Math.max(monthBuckets[mo][k.label]||0,k.current)})});
  const weeklyTotals={},monthlyTotals={};
  Object.values(weekBuckets).forEach(wk=>{Object.entries(wk).forEach(([l,v])=>{weeklyTotals[l]=(weeklyTotals[l]||0)+v})});
  Object.values(monthBuckets).forEach(mo=>{Object.entries(mo).forEach(([l,v])=>{monthlyTotals[l]=(monthlyTotals[l]||0)+v})});
  const buildKpi=k=>{let cur=k.current;if(weeklyKpis[k.label]!==undefined&&weeklyTotals[k.label]!==undefined)cur=weeklyTotals[k.label];if(monthlyKpis[k.label]!==undefined&&monthlyTotals[k.label]!==undefined)cur=monthlyTotals[k.label];return{label:k.label,current:cur,target:scaleTarget(k.label,period)??k.target}};
  return{content:(latest.kpis?.content||[]).map(buildKpi),website:(latest.kpis?.website||[]).map(buildKpi)};
}

function renderAggregateView(title,subtitle,datesInRange,period){
  if(!datesInRange.length){$('content').innerHTML=`<div class="no-data">No data for ${title}.</div>`;return}
  const latest=allData[datesInRange[datesInRange.length-1]];
  if(!latest){$('content').innerHTML=`<div class="no-data">No data for ${title}.</div>`;return}
  const daysReporting=datesInRange.filter(d=>allData[d]).length;
  const numWeeks=Object.keys((()=>{const b={};datesInRange.forEach(d=>b[getWeek(d).start]=1);return b})()).length;
  const kpis=getCumulativeKpis(datesInRange,period);
  const allK=[...kpis.content,...kpis.website];
  const onTrack=allK.filter(k=>k.current>=k.target).length;

  let h=`<div class="glass-card-dark" style="margin-bottom:18px"><div style="font-size:16px;font-weight:700;margin-bottom:4px">${title}</div><div style="font-size:13px;opacity:0.6">${subtitle} · ${daysReporting} days of data · ${numWeeks} week${numWeeks!==1?'s':''}</div></div>`;

  h+=`<div class="stats-row"><div class="stat-card"><div class="stat-label">KPIs on track</div><div class="stat-val" style="color:var(--green)">${onTrack}<span class="stat-sub">/${allK.length}</span></div></div><div class="stat-card"><div class="stat-label">Days reporting</div><div class="stat-val" style="color:var(--blue)">${daysReporting}</div></div><div class="stat-card"><div class="stat-label">Overdue renewals</div><div class="stat-val" style="color:var(--red)">${latest.finance?.overdue?.length||0}</div></div><div class="stat-card"><div class="stat-label">Active subs</div><div class="stat-val" style="color:var(--accent)">${latest.finance?.totals?.active_subs||12}</div></div></div>`;

  h+='<div class="g2">';
  h+='<div class="glass-card"><div class="wst">Content & campaigns</div>';
  kpis.content.forEach(k=>h+=kpiRow(k));
  if(latest.content?.promotions)h+=`<div class="fin-row"><span class="fin-name">Active promotions</span><span class="fin-val" style="color:var(--navy)">${latest.content.promotions.count}</span></div>`;
  h+='</div>';
  h+='<div class="glass-card"><div class="wst">Website & SEO</div>';
  kpis.website.forEach(k=>h+=kpiRow(k));
  if(latest.website?.backlogs){h+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">';h+=`<div class="fin-row"><span class="fin-name">Website pages backlog</span><span class="fin-val">${latest.website.backlogs.website_pages}</span></div>`;h+=`<div class="fin-row"><span class="fin-name">Product pages backlog</span><span class="fin-val">${latest.website.backlogs.product_pages}</span></div>`;h+=`<div class="fin-row"><span class="fin-name">SEO backlog</span><span class="fin-val" style="color:var(--accent)">${latest.website.backlogs.seo}</span></div></div>`}
  h+='</div>';

  h+='<div class="glass-card"><div class="wst">Events</div>';
  (latest.events||[]).forEach(evt=>{const pct=evt.tasks_total>0?Math.round((evt.tasks_complete/evt.tasks_total)*100):0;h+=`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="fin-name" style="font-weight:600">${evt.name}</span><span class="badge b-navy">${evt.days_out} days</span></div><div class="list-sub" style="margin-bottom:6px">${evt.date} · ${evt.location}</div><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:var(--accent)"></div></div><span style="font-size:12px;font-weight:700;color:var(--accent);min-width:50px;text-align:right">${evt.tasks_complete}/${evt.tasks_total}</span></div></div>`});
  h+='</div>';

  h+='<div class="glass-card"><div class="wst">Finance</div>';
  if(latest.finance?.totals){h+=`<div class="fin-row"><span class="fin-name">Monthly software cost</span><span class="fin-val">$${latest.finance.totals.monthly}/mo</span></div>`;h+=`<div class="fin-row"><span class="fin-name">Active subscriptions</span><span class="fin-val">${latest.finance.totals.active_subs}</span></div>`;h+=`<div class="fin-row"><span class="fin-name">Thomas card owed</span><span class="fin-val" style="color:var(--amber)">$${latest.finance.totals.thomas_monthly}/mo</span></div>`}
  h+='</div></div>';
  $('content').innerHTML=h;
}

function renderWeeklySummary(ds){const wk=getWeek(ds);const datesInRange=allDates.filter(d=>d>=wk.start&&d<=wk.end);Promise.all(datesInRange.map(d=>loadDate(d))).then(()=>{renderAggregateView(`Week of ${wk.label}`,'Weekly KPI tracking',datesInRange,'weekly')})}
function renderMonthlySummary(ds){const mo=getMonth(ds);const datesInRange=allDates.filter(d=>getMonth(d)===mo);Promise.all(datesInRange.map(d=>loadDate(d))).then(()=>{renderAggregateView(monthLabel(ds),'Monthly performance',datesInRange,'monthly')})}
function renderQuarterlySummary(ds){const q=getQuarter(ds);const m=parseInt(ds.slice(5,7));const qStart=Math.floor((m-1)/3)*3+1;const qEnd=qStart+2;const y=ds.slice(0,4);const datesInRange=allDates.filter(d=>{const dm=parseInt(d.slice(5,7));return d.slice(0,4)===y&&dm>=qStart&&dm<=qEnd});Promise.all(datesInRange.map(d=>loadDate(d))).then(()=>{renderAggregateView(qLabel(q),'Quarterly performance',datesInRange,'quarterly')})}
function renderAnnualSummary(ds){const y=getYear(ds);const datesInRange=allDates.filter(d=>getYear(d)===y);Promise.all(datesInRange.map(d=>loadDate(d))).then(()=>{renderAggregateView(y+' Annual Summary','Year-to-date performance',datesInRange,'annual')})}

init();
-e 
</script>
